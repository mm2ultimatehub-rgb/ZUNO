name: ZUNO Preview APK

on:
  push:
    branches:
      - feature/dalga-glass-player
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zuno-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign ZUNO universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Build universal release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleGmsMobileUniversalRelease

      - name: Sign and verify APK
        id: signed
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS_INPUT: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEY_ALIAS STORE_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name (configure KEYSTORE, KEY_ALIAS, KEYSTORE_PASSWORD)."
              exit 1
            fi
          done

          KEYSTORE_FILE="$RUNNER_TEMP/zuno-release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          keytool -list -keystore "$KEYSTORE_FILE" -storepass:env STORE_PASS -alias "$KEY_ALIAS" >/dev/null
          KEY_PASS="${KEY_PASS_INPUT:-$STORE_PASS}"
          export KEY_PASS

          APK="$(find app/build/outputs/apk -type f -name '*-unsigned.apk' | head -n 1)"
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          fi
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "::error::No release APK was produced"
            find app/build/outputs/apk -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED="$RUNNER_TEMP/zuno-aligned.apk"
          SIGNED="$RUNNER_TEMP/ZUNO-universal-signed.apk"
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE_FILE" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED"
          echo "path=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: zuno-preview-universal-signed
          path: ${{ steps.signed.outputs.path }}
          if-no-files-found: error
          retention-days: 14
